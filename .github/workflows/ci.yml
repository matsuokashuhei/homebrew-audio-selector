name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  formula:
    name: Homebrew formula
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Homebrew version
        run: brew --version

      - name: Tap local checkout
        run: brew tap matsuokashuhei/sound-selector "$GITHUB_WORKSPACE"

      - name: Install formula from source
        run: brew install --build-from-source matsuokashuhei/sound-selector/select-sound

      - name: Test formula
        run: brew test matsuokashuhei/sound-selector/select-sound
