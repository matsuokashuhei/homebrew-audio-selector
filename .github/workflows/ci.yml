name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  formula:
    name: Homebrew formula
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Homebrew version
        run: brew --version

      - name: Install formula from source
        run: brew install --build-from-source ./Formula/select-sound.rb

      - name: Test formula
        run: brew test select-sound
